<section id="historia" class="relative py-28 sm:py-40 px-6">
  <div class="mx-auto max-w-3xl text-center">
    <p appScrollReveal class="font-body text-xs sm:text-sm tracking-[0.4em] uppercase text-nova-300/80 mb-4">
      Nuestra historia
    </p>
    <h2 appScrollReveal class="reveal-delay-1 font-display text-4xl sm:text-6xl font-bold mb-6">
      Un poco de <span class="text-gradient-nova">nosotros</span>
    </h2>
    <p appScrollReveal class="reveal-delay-2 font-body text-white/60 max-w-xl mx-auto">
      Una pequeña línea de tiempo con lo que hemos vivido. Se irá llenando de recuerdos reales muy pronto.
    </p>
  </div>

  <div class="relative mx-auto mt-24 max-w-2xl">
    <div class="absolute left-4 sm:left-1/2 top-0 h-full w-px bg-gradient-to-b from-transparent via-nova-500/50 to-transparent sm:-translate-x-1/2"></div>

    <div class="space-y-16">
      <div
        *ngFor="let m of milestones; let i = index"
        appScrollReveal
        class="relative flex flex-col sm:flex-row items-start sm:items-center gap-6"
        [class.sm:flex-row-reverse]="i % 2 === 1"
      >
        <div class="absolute left-4 sm:left-1/2 h-3 w-3 -translate-x-1/2 rounded-full bg-nova-400 shadow-glow"></div>

        <div class="sm:w-1/2" [class.sm:text-right]="i % 2 === 0" [class.sm:pr-10]="i % 2 === 0" [class.sm:pl-10]="i % 2 === 1"></div>

        <div class="pl-12 sm:pl-10 sm:w-1/2 group">
          <div class="rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-sm p-6 transition-all duration-500 hover:border-nova-400/50 hover:shadow-glow hover:-translate-y-1">
            <span class="font-body text-xs tracking-[0.3em] uppercase text-nova-300">{{ m.date }}</span>
            <h3 class="font-display text-xl sm:text-2xl font-semibold mt-2 mb-2">{{ m.title }}</h3>
            <p class="font-body text-sm text-white/60 leading-relaxed">{{ m.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
