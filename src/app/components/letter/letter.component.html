<section class="relative py-28 sm:py-40 px-6">
  <div class="mx-auto max-w-2xl">
    <p appScrollReveal class="text-center font-body text-xs sm:text-sm tracking-[0.4em] uppercase text-nova-300/80 mb-14">
      Una carta para ti
    </p>

    <div class="rounded-3xl border border-white/10 bg-white/[0.03] backdrop-blur-sm p-8 sm:p-14 shadow-glow">
      <p
        *ngFor="let para of paragraphs; let i = index; let first = first"
        appScrollReveal
        [class]="'reveal-delay-' + ((i % 4) + 1)"
        class="font-display text-lg sm:text-xl leading-relaxed text-white/85 mb-6 last:mb-0"
        [class.text-2xl]="first"
        [class.text-nova-200]="first"
      >
        {{ para }}
      </p>

      <p appScrollReveal class="reveal-delay-4 mt-10 text-right font-display text-lg italic text-white/60">
        — con todo mi cariño
      </p>
    </div>
  </div>
</section>
