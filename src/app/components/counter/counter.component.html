<section class="relative py-28 sm:py-40 px-6">
  <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
    <div class="h-[28rem] w-[28rem] rounded-full bg-nova-600/20 blur-[120px] animate-pulse-glow"></div>
  </div>

  <div class="relative mx-auto max-w-3xl text-center">
    <p appScrollReveal class="font-body text-xs sm:text-sm tracking-[0.4em] uppercase text-nova-300/80 mb-4">
      Juntos desde hace
    </p>
    <h2 appScrollReveal class="reveal-delay-1 font-display text-3xl sm:text-5xl font-bold mb-16">
      Cada segundo <span class="text-gradient-nova">cuenta</span>
    </h2>

    <div appScrollReveal class="reveal-delay-2 grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
      <div class="rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-sm py-8 px-4 transition-all duration-500 hover:border-nova-400/50 hover:shadow-glow">
        <span class="block font-display text-4xl sm:text-6xl font-bold text-gradient-nova tabular-nums">{{ days }}</span>
        <span class="mt-2 block font-body text-xs sm:text-sm tracking-[0.2em] uppercase text-white/50">Días</span>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-sm py-8 px-4 transition-all duration-500 hover:border-nova-400/50 hover:shadow-glow">
        <span class="block font-display text-4xl sm:text-6xl font-bold text-gradient-nova tabular-nums">{{ hours }}</span>
        <span class="mt-2 block font-body text-xs sm:text-sm tracking-[0.2em] uppercase text-white/50">Horas</span>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-sm py-8 px-4 transition-all duration-500 hover:border-nova-400/50 hover:shadow-glow">
        <span class="block font-display text-4xl sm:text-6xl font-bold text-gradient-nova tabular-nums">{{ minutes }}</span>
        <span class="mt-2 block font-body text-xs sm:text-sm tracking-[0.2em] uppercase text-white/50">Min</span>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-sm py-8 px-4 transition-all duration-500 hover:border-nova-400/50 hover:shadow-glow">
        <span class="block font-display text-4xl sm:text-6xl font-bold text-gradient-nova tabular-nums">{{ seconds }}</span>
        <span class="mt-2 block font-body text-xs sm:text-sm tracking-[0.2em] uppercase text-white/50">Seg</span>
      </div>
    </div>

    <p appScrollReveal class="reveal-delay-3 mt-8 font-body text-sm text-nova-200/80">
      Y cada 19, sin falta, un mes más de nosotros 💜
    </p>
  </div>
</section>
